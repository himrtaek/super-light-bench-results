<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a0a">
  <title>하층 수로 — 손전등 탐색</title>
  <link rel="preload" href="assets/sluice-corridor.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/inspection-lamp.webp" as="image">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main id="game" aria-label="어두운 수로에서 손전등으로 밸브를 찾아 격벽을 여는 게임">
    <canvas id="scene" aria-label="관과 난간이 있는 어두운 공장 통로"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <img id="lamp" src="assets/inspection-lamp.webp" alt="" draggable="false">
    <div class="frame frame--top" aria-hidden="true"></div>
    <div class="frame frame--bottom" aria-hidden="true"></div>
    <div class="topline"><span class="locator">SUMP / 07</span><span id="time">00:10</span></div>
    <section class="brief" aria-live="polite">
      <p class="brief__eyebrow">EMERGENCY DRAIN / LOWER LEVEL</p>
      <h1 id="objective">손전등으로 압력 밸브를 찾으세요</h1>
      <p id="detail">시점을 돌려 밸브를 비춘 뒤 점검하세요.</p>
      <div class="brief__track"><span id="track"></span></div>
    </section>
    <div id="reticle" class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="hint" class="hint" aria-live="polite"></div>
    <div class="controls">
      <div class="controls__buttons">
        <button id="stepBtn" type="button" aria-label="앞으로 이동">↑ <span>전진</span></button>
        <button id="useBtn" type="button" aria-label="밸브 점검">◇ <span>점검</span></button>
        <button id="lightBtn" type="button" aria-label="손전등 켜기 또는 끄기">◉ <span>빛</span></button>
      </div>
      <p class="controls__keys">W 전진 · A/D 시점 · 마우스/터치로 조준 · E 점검 · F 빛</p>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
