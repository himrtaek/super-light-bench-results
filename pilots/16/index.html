<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11152e">
<title>Astral Archive — 퍼즐 품질 파일럿</title>
<link rel="preload" href="assets/observatory.webp" as="image" fetchpriority="high">
<link rel="preload" href="assets/astral-pieces-v2.webp" as="image">
<style>
:root{color-scheme:dark;background:#11152e;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.2) brightness(1.3)}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,#080a1b48,transparent 20%,transparent 80%,#080a1b48),linear-gradient(#070b1930 0%,transparent 23%,transparent 73%,#070b194a 100%)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font:600 11px system-ui;color:#f7e8c8b0;letter-spacing:.02em;white-space:nowrap;max-width:calc(100vw - 16px);font-size:clamp(9px,2.1vw,11px);pointer-events:none;text-shadow:0 1px 4px #15112f}
</style>
</head>
<body>
<img id="scene" src="assets/observatory.webp" alt="" fetchpriority="high">
<div id="shade"></div>
<canvas id="game" aria-label="별빛 퍼즐판. 인접한 조각을 드래그해 같은 조각 세 개를 맞추세요."></canvas>
<div id="hint">인접한 조각을 드래그해 별자리를 맞추세요</div>
<script src="game.js" defer></script>
</body>
</html>
