canvas.addEventListener('pointerdown',e=>{if(state.busy)return;const h=hit(e);if(!h)return;canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,cell:h,x:e.clientX,y:e.clientY};if(pick&&Math.abs(pick[0]-h[0])+Math.abs(pick[1]-h[1])===1){swap(...pick,...h);pointer=null}else pick=h;draw()});canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const h=hit(e),start=pointer.cell;pointer=null;if(h&&Math.abs(start[0]-h[0])+Math.abs(start[1]-h[1])===1)swap(...start,...h);draw()});canvas.addEventListener('pointercancel',()=>{pointer=null});
document.getElementById('demo').onclick=()=>swap(3,3,3,4);document.getElementById('reset').onclick=reset;
function snapshot(){return {ready,t:+t.toFixed(4),board:state.board.map(row=>row.map(o=>o?{id:o.id,color:o.color,special:o.special}:null)),score:state.score,moves:state.moves,turns:state.turns,chain:state.chain,maxChain:state.maxChain,cleared:state.cleared,busy:state.busy,lastAction:state.lastAction,events:state.events.map(e=>({...e})),viewport:{width:innerWidth,height:innerHeight,wide:L.wide},boardLayout:{x:OX+L.x*SCALE,y:OY+L.y*SCALE,cell:L.c*SCALE},paused}}
window.__pilot50={get ready(){return ready},snapshot,reset,swap,setTime(v){paused=true;advance(v);return snapshot()},step(v){paused=true;advance(t+v);return snapshot()},resume(){paused=false;last=performance.now()},pause(){paused=true},demo(){return swap(3,3,3,4)},setPaused(v){paused=!!v}};
function tick(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(ready&&!paused)advance(t+dt);requestAnimationFrame(tick)}
atlas.onload=()=>{reset();ready=true;layout()};atlas.onerror=e=>{throw Error('original jelly atlas failed to load')};atlas.src=ATLAS;addEventListener('resize',layout);requestAnimationFrame(tick);
})();
