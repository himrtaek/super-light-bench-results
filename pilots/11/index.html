function prepareGroundPatch(){const c=document.createElement('canvas');c.width=444;c.height=420;const z=c.getContext('2d');z.drawImage(imgs['lodge-ground'],0,0);z.globalCompositeOperation='destination-in';const edge=28;for(const axis of ['x','y']){const n=axis==='x'?c.width:c.height,g=z.createLinearGradient(0,0,axis==='x'?n:0,axis==='y'?n:0);g.addColorStop(0,'#0000');g.addColorStop(edge/n,'#000');g.addColorStop(1-edge/n,'#000');g.addColorStop(1,'#0000');z.fillStyle=g;z.fillRect(0,0,c.width,c.height)}lodgePatch=c}

function actor(id){let x,y,pose=0;const speed=heat<.2?.13:.24;if(id===0&&supplyJob){const k=clamp((T-supplyJob.startedAt)/2.6,0,1);x=648+(580-648)*k;y=553+(1050-553)*k;pose=1}else if(id===1&&buildJob){const k=clamp((T-buildJob.startedAt)/1.2,0,1);x=610+125*k;y=1040+190*k;pose=k===1?2:0}else{const r=routes[id],k=(Math.sin(T*speed+id*1.7)+1)/2;x=r[0][0]+(r[1][0]-r[0][0])*k;y=r[0][1]+(r[1][1]-r[0][1])*k;}return{id,x,y,pose,working:pose===2,carrying:pose===1,pace:heat<.2?'cold':'normal'}}

function render(){if(!ready)return;ctx=worldCtx;background('winter');if(lodgeBuilt)ctx.drawImage(lodgePatch,580,910,444,420);warmGround();fire();const a=routes.map((_,i)=>actor(i));const objects=a.map(v=>({y:v.y,draw:()=>{const size=84,name='worker-'+v.pose,sway=v.working?Math.sin(T*9)*1.5:Math.sin(T*5+v.id)*.8,marks=feet(name,v.x+sway,v.y,size,size);ctx.save();ctx.filter='blur(2px)';ellipse(v.x+7,v.y+2,15,4,'#53678232');ctx.restore();footContacts(marks,'snow');ctx.save();ctx.filter='saturate(.82) contrast(.82) brightness(1.10)';sprite(name,v.x+sway,v.y,size,size);ctx.restore();const warmth=heat*clamp(1-Math.hypot(v.x-499,(v.y-938)*1.2)/275,0,1);if(warmth>0){ctx.save();ctx.globalCompositeOperation='soft-light';ctx.filter='sepia(1) saturate(1.9)';sprite(name,v.x+sway,v.y,size,size,warmth*.48);ctx.restore()}}}));if(buildJob){objects.push({y:1255,draw:()=>{const k=lodgeBuilt?1:clamp((T-buildJob.startedAt)/4.8,0,1);ctx.save();ctx.filter='blur(7px)';ellipse(815,1248,131,28,'#47537045');ctx.restore();ellipse(803,1247,108,10,'#48516c45');ctx.save();ctx.filter='saturate(.88) contrast(.96) brightness(1.0)';sprite('lodge',803,1248,440,293,lodgeBuilt?1:.2+.6*k);ctx.restore();if(!lodgeBuilt){ctx.strokeStyle='#e4b973';ctx.lineWidth=3;ctx.setLineDash([11,7]);ctx.strokeRect(670,1110,266,145);ctx.setLineDash([])}}})}objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
