<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07121a">
  <title>수문 아래 — 네온 밤거리 파일럿 #20</title>
  <link rel="preload" href="assets/tidelock-causeway.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main id="game" class="game" aria-label="비 내리는 항구 도시를 걸어 수문 신호를 확인하는 짧은 게임">
    <div id="scene" class="scene" role="img" aria-label="비에 젖은 상점가와 운하를 지나 먼 수문으로 이어지는 야간 보행로">
      <img id="sceneArt" class="scene__art" src="assets/tidelock-causeway.webp" alt="" fetchpriority="high" decoding="async">
      <div class="scene__depth scene__depth--far"></div>
      <div class="scene__beam"></div>
      <div class="scene__depth scene__depth--near"></div>
      <canvas id="weather" class="scene__weather" aria-hidden="true"></canvas>
      <div class="scene__grade"></div>
      <div class="scene__vignette"></div>
      <div id="pulse" class="pulse" aria-hidden="true"></div>
    </div>

    <div class="hud hud--top" aria-hidden="true">
      <div class="brand"><span class="brand__rune">◈</span><span class="brand__name">TIDELOCK</span><span class="brand__sub">潮門 지구 / 04</span></div>
      <div class="status"><span class="status__light"></span><span id="statusText">수문 신호 미확인</span><span class="status__bar"></span><span id="clock">00:10</span></div>
    </div>

    <div id="marker" class="marker" aria-hidden="true"><span class="marker__diamond">◇</span><span class="marker__line"></span><span class="marker__label">FLOODGATE / 01</span><span id="distance" class="marker__distance">280 M</span></div>

    <div class="hud hud--bottom">
      <section class="objective" aria-live="polite">
        <div class="objective__eyebrow"><span>ROUTE 07</span><span id="routeState">SIGNAL LOST</span></div>
        <h1 id="objectiveTitle">수문 아래의 신호</h1>
        <p id="objectiveText">젖은 보행로를 따라 수문에 접근하세요.</p>
        <div class="objective__track"><span id="progressFill"></span></div>
      </section>
      <div class="controls" aria-label="이동과 탐색 조작">
        <p class="controls__hint">W / ↑ 전진 <span>·</span> 화면 드래그로 둘러보기</p>
        <div class="controls__row"><button id="moveBtn" class="control control--move" type="button"><span class="control__icon">↑</span><span>앞으로</span></button><button id="scanBtn" class="control control--scan" type="button"><span class="control__icon">⌁</span><span>신호 확인</span></button></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="corner corner--left" aria-hidden="true"></div><div class="corner corner--right" aria-hidden="true"></div>
  </main>
</body>
</html>
