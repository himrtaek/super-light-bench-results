<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>달물결 항로 — 바다 조타 파일럿</title>
<link rel="preload" href="assets/afterstorm-sea.webp" as="image">
<link rel="preload" href="assets/wind-skiff.webp" as="image">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#eef8f4;background:#061625}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#grain{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 44%,transparent 40%,#020d1a88 100%);mix-blend-mode:multiply}#hud{position:fixed;inset:0;pointer-events:none}#hud>*{pointer-events:auto}#masthead{position:absolute;left:max(24px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));filter:drop-shadow(0 3px 10px #02101e)}#eyebrow{font-size:10px;font-weight:700;letter-spacing:.3em;color:#b8d8d6}h1{font:600 clamp(25px,3vw,40px)/1 Georgia,'Apple SD Gothic Neo',serif;letter-spacing:.02em;margin:7px 0 5px;color:#f4efd9}#subtitle{font-size:11px;letter-spacing:.08em;color:#d6e6df}#rightTop{position:absolute;right:max(24px,env(safe-area-inset-right));top:max(19px,env(safe-area-inset-top));display:flex;gap:15px;align-items:flex-start}.plate{border:1px solid #c1ddd472;background:linear-gradient(120deg,#082737ce,#082136a9);box-shadow:0 7px 30px #00121a70,inset 0 1px #e7fff025;backdrop-filter:blur(12px)}#windBox{padding:9px 12px;min-width:110px}#windBox small,#timer small{display:block;font-size:9px;letter-spacing:.2em;color:#bed5ce}#windLabel{display:flex;align-items:center;gap:8px;margin-top:4px;font:600 17px Georgia,serif;color:#e7f7e8}#windArrow{font:24px/1 system-ui;display:inline-block;color:#b5f7e5;transition:transform .5s ease}#timer{padding:8px 12px;text-align:right;min-width:75px}#timer strong{display:block;font:600 25px/1 Georgia,serif;margin-top:4px;color:#fff4df}#guide{position:absolute;left:50%;top:15%;transform:translateX(-50%);text-align:center;min-width:min(70vw,380px);padding:10px 18px;border-top:1px solid #def5de9e;border-bottom:1px solid #def5de9e;background:#0521378a;text-shadow:0 2px 8px #00131e;font:600 clamp(12px,1.2vw,16px)/1.4 Georgia,'Apple SD Gothic Neo',serif;letter-spacing:.09em;transition:opacity .5s}#bottom{position:absolute;left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:18px}#heading{width:170px;padding:10px 13px}#heading small,#route small{font-size:9px;letter-spacing:.18em;color:#b7d6d0}#heading strong{display:block;font:600 19px Georgia,serif;color:#eaf3e8;margin-top:3px}#compass{position:relative;height:10px;border:1px solid #a9d0c16c;background:linear-gradient(90deg,#3b7391,#b9e3d2 50%,#3b7391);margin-top:9px}#needle{position:absolute;left:50%;top:-4px;width:2px;height:17px;background:#ffdcaa;box-shadow:0 0 7px #ffeac4;transform:translateX(-50%)}#route{flex:1;max-width:350px;padding:10px 13px}#routeTop{display:flex;justify-content:space-between;align-items:baseline}#route strong{font:600 17px Georgia,serif;color:#eaf3e8}#routeTrack{position:relative;height:7px;margin-top:10px;border:1px solid #b4e2d276;background:#0d354d}#routeFill{height:100%;width:0%;background:linear-gradient(90deg,#4e999e,#d9f3db);box-shadow:0 0 12px #a4f4da8c}#routeEnd{position:absolute;right:-2px;top:-6px;color:#e8d59f;font-size:17px}#controls{display:flex;align-items:center;gap:9px;margin-left:auto}#controls button{height:52px;border:1px solid #c4e5d796;background:linear-gradient(150deg,#0a3949db,#062337df);box-shadow:0 5px 22px #001521b0,inset 0 1px #ffffff35;touch-action:none;user-select:none;transition:background .2s,transform .12s}#controls button:active,#controls button.active{background:linear-gradient(140deg,#2d827f,#104a61);transform:translateY(2px)}#left,#right{width:54px;font:26px Georgia,serif}#brace{width:108px;font:600 12px 'Apple SD Gothic Neo',sans-serif;letter-spacing:.06em}#brace small{display:block;font-size:9px;opacity:.8;font-weight:400}#result{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);min-width:280px;text-align:center;padding:26px 32px;background:linear-gradient(150deg,#092b3def,#061b2df2);border:1px solid #d7e5c7aa;box-shadow:0 22px 70px #00101de0;display:none}#result.show{display:block}#result small{letter-spacing:.25em;color:#b6d9d4;font-size:10px}#result h2{font:600 32px Georgia,serif;margin:10px 0;color:#fff3da}#result p{font-size:13px;color:#c7ded9;line-height:1.5}#restart{padding:10px 18px;margin-top:5px;border:1px solid #c8e6c5;background:#215b60;color:#fff8e7}#load{position:fixed;inset:0;display:grid;place-items:center;background:#061625;color:#d6efe7;font:16px Georgia,serif;z-index:5;transition:opacity .5s}#load.hide{opacity:0;pointer-events:none}@media(max-width:720px){#masthead{left:16px;top:max(12px,env(safe-area-inset-top))}h1{font-size:25px}#eyebrow{font-size:8px}#subtitle{font-size:9px}#rightTop{right:12px;top:max(11px,env(safe-area-inset-top));gap:5px}#windBox{min-width:77px;padding:6px 7px}#windBox small,#timer small{font-size:7px}#windLabel{font-size:12px;gap:3px}#windArrow{font-size:18px}#timer{min-width:48px;padding:6px 7px}#timer strong{font-size:18px}#guide{top:17%;min-width:70vw;font-size:11px;padding:7px 10px}#bottom{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));gap:7px;align-items:flex-end;flex-wrap:wrap}#heading{width:calc(44% - 4px);padding:6px 8px}#heading strong{font-size:14px}#heading small,#route small{font-size:7px}#route{width:calc(56% - 4px);max-width:none;flex:none;padding:6px 8px}#route strong{font-size:13px}#controls{width:100%;justify-content:center;order:-1;margin:0 0 5px;gap:10px}#controls button{height:54px}#left,#right{width:64px}#brace{width:120px}#result{top:46%;width:min(85vw,340px)}}@media(max-height:450px){#guide{top:11%;left:39%}#bottom{bottom:8px}#controls button{height:42px}#heading,#route{display:none}#masthead{top:9px}#rightTop{top:9px}}
</style>
</head>
<body>
<canvas id="sea" aria-label="달빛 바다에서 배를 조타하는 게임 장면"></canvas><div id="grain"></div>
<div id="hud"><div id="masthead"><div id="eyebrow">MOONWAKE / VOYAGE 01</div><h1>달물결 항로</h1><div id="subtitle">부서진 바람문을 통과하라</div></div><div id="rightTop"><div id="windBox" class="plate"><small>바람 / WIND</small><div id="windLabel"><span id="windArrow">➤</span><span id="windText">순풍</span></div></div><div id="timer" class="plate"><small>남은 시간</small><strong id="seconds">10.0</strong></div></div><div id="guide">← → 조타 · SPACE 돛 당기기</div><div id="bottom"><div id="heading" class="plate"><small>현재 침로</small><strong id="headingText">바람문 정면</strong><div id="compass"><div id="needle"></div></div></div><div id="route" class="plate"><div id="routeTop"><small>항로 진행</small><strong id="distance">0%</strong></div><div id="routeTrack"><div id="routeFill"></div><div id="routeEnd">◆</div></div></div><div id="controls"><button id="left" aria-label="왼쪽으로 조타">◀</button><button id="brace" aria-label="돛 당기기">돛 당기기<small>SPACE</small></button><button id="right" aria-label="오른쪽으로 조타">▶</button></div></div><div id="result" role="status"><small>VOYAGE COMPLETE</small><h2 id="resultTitle">바람문 통과</h2><p id="resultBody"></p><button id="restart">다시 항해</button></div></div><div id="load">바람을 읽는 중…</div>
<script src="game.js"></script>
</body></html>
