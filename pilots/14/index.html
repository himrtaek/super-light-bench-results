<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111929"><title>월식 관측소 — 회화 전투 파일럿</title>
<link rel="preload" as="image" href="assets/moon-observatory-background.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/copper-hero.webp">
<link rel="preload" as="image" href="assets/stone-wraiths.webp">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111929;color:#fff6dd}*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
#art{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 54%;transition:transform .14s ease-out;filter:saturate(.97)}
#shade{position:fixed;inset:0;background:linear-gradient(#030817a0 0%,transparent 23%,transparent 75%,#03081791 100%);pointer-events:none}
#hero-art,#foes-art{position:fixed;pointer-events:none;height:auto;will-change:transform}
#hero-art{left:20%;top:47%;width:45%;filter:drop-shadow(0 11px 5px #080d18aa);animation:heroIdle 2.2s ease-in-out infinite alternate}
#foes-art{left:43%;top:21%;width:44%;filter:drop-shadow(0 10px 6px #080d18aa) drop-shadow(0 0 6px #f8d8ab44);animation:foeIdle 2.7s ease-in-out infinite alternate}
@keyframes heroIdle{to{transform:translateY(-1.3%)}}@keyframes foeIdle{to{transform:translateY(-1.7%)}}
.strike #hero-art{animation:none;transform:translate(5%,-3%) scale(1.03)}
.strike #foes-art{animation:none;transform:translate(2%,-1%);filter:brightness(1.45) drop-shadow(0 0 12px #ffdc98)}
body.capture #hero-art,body.capture #foes-art{animation:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#brand{position:fixed;left:clamp(15px,2vw,28px);top:max(14px,env(safe-area-inset-top));font:700 clamp(11px,1.4vw,15px) Georgia,serif;letter-spacing:.18em;color:#f4d9a3;text-shadow:0 2px 7px #000}
#brand strong{display:block;font:700 clamp(19px,2.5vw,29px) Georgia,serif;letter-spacing:.01em;color:#fff2cf}
#boss{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);width:min(32vw,300px);min-width:190px;text-align:center;text-shadow:0 2px 5px #000}
#boss-name{font:700 11px system-ui;letter-spacing:.14em;color:#f0d5a9}#boss-track{margin-top:6px;height:10px;background:#172038df;border:1px solid #d7aa6999;box-shadow:0 3px 8px #0008;overflow:hidden}
#boss-fill{height:100%;width:100%;background:linear-gradient(90deg,#8c4239,#e3a45e);transition:width .3s}
#hero{position:fixed;left:clamp(16px,2vw,28px);bottom:max(16px,env(safe-area-inset-bottom));width:min(26vw,230px)}
#hero span{font:700 11px system-ui;letter-spacing:.13em;text-shadow:0 1px 4px #000}#hero-track{margin-top:6px;height:12px;border:1px solid #e0b4789c;background:#111827db;box-shadow:0 3px 8px #0008}#hero-fill{width:82%;height:100%;background:linear-gradient(90deg,#51a4a8,#b8e5cd)}
#strike{position:fixed;right:clamp(18px,3vw,42px);bottom:max(16px,env(safe-area-inset-bottom));width:clamp(76px,12vw,110px);height:clamp(76px,12vw,110px);border-radius:50%;border:3px solid #f1d498;color:#fff7dc;background:radial-gradient(circle at 35% 25%,#f7c775,#8d4a32 58%,#42273c 95%);box-shadow:0 0 0 5px #152339d9,0 5px 20px #0009;cursor:pointer;font:800 12px system-ui;letter-spacing:.08em;text-shadow:0 2px 3px #3b1924;touch-action:manipulation}
#strike:before{content:'✦';display:block;font:40px Georgia,serif;line-height:38px}#strike:active{transform:scale(.94)}
#note{position:fixed;right:clamp(18px,3vw,42px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + clamp(86px,12vw,120px));font:11px system-ui;color:#fae4c0;text-shadow:0 2px 5px #000}
@media(max-width:650px){#art{height:100%;object-position:50% center}#brand{top:12px}#boss{top:64px;width:46vw;min-width:170px}#strike{right:18px;bottom:max(18px,env(safe-area-inset-bottom))}#hero{bottom:max(22px,env(safe-area-inset-bottom));width:150px}#note{display:none}#hero-art{left:-9%;top:52%;width:85%}#foes-art{left:18%;top:25%;width:96%}}
</style>
</head>
<body>
<img id="art" src="assets/moon-observatory-background.webp" alt="달빛 아래 무너진 천문대에서 창을 든 전사가 망령과 싸우는 회화 장면" fetchpriority="high">
<div id="shade"></div><img id="foes-art" src="assets/stone-wraiths.webp" alt=""><img id="hero-art" src="assets/copper-hero.webp" alt=""><canvas id="fx" aria-hidden="true"></canvas>
<div id="brand">CHAPTER II <strong>월식 관측소</strong></div>
<div id="boss"><div id="boss-name">잠든 별의 파수꾼</div><div id="boss-track"><div id="boss-fill"></div></div></div>
<div id="hero"><span>관측자 · 128 / 160</span><div id="hero-track"><div id="hero-fill"></div></div></div>
<div id="note">망령에게 창을 휘두르세요</div><button id="strike" aria-label="공격">공격</button>
<script>
(()=>{const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');const art=document.getElementById('art');
 const params=new URLSearchParams(location.search);let hp=100,attackAt=-Infinity,attacks=0,dpr=1,w=1,h=1;
 function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';}
 function attack(){if(hp<=0){hp=100;attacks=0;}hp=Math.max(0,hp-18);attacks++;attackAt=performance.now();document.getElementById('boss-fill').style.width=hp+'%';document.body.classList.add('strike');setTimeout(()=>document.body.classList.remove('strike'),230);}
 function draw(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const narrow=w<650,ax=w*(narrow?.72:.73),ay=h*(narrow?.45:.53),ar=Math.min(w,h)*.115,phase=params.has('capture')?.35:t*.00045;
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.58;ctx.strokeStyle='#f6ce75';ctx.lineWidth=Math.max(2,Math.min(w,h)*.006);ctx.beginPath();ctx.arc(ax,ay,ar,-.8+phase,1.8+phase);ctx.stroke();
  for(let i=0;i<9;i++){const q=i*6.283/9+phase,x=ax+Math.cos(q)*ar*.72,y=ay+Math.sin(q)*ar*.72;ctx.fillStyle=i%3?'#f5d68e':'#bce8e8';ctx.beginPath();ctx.arc(x,y,Math.max(1.5,Math.min(w,h)*.005),0,7);ctx.fill();}ctx.restore();
  const dt=(t-attackAt)/1000;if(dt>=0&&dt<.55){
  const narrow=w<650,cx=w*(narrow?.72:.69),cy=h*(narrow?.45:.53),sx=w*(narrow?.62:.59),sy=h*(narrow?.64:.72),r=Math.min(w,h)*(.09+dt*.33),a=1-dt/.55;
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=a;
  const flash=ctx.createRadialGradient(cx,cy,1,cx,cy,r*1.5);flash.addColorStop(0,'#fffde0');flash.addColorStop(.12,'#ffde8d');flash.addColorStop(.35,'#ff844455');flash.addColorStop(1,'#ff844400');ctx.fillStyle=flash;ctx.beginPath();ctx.arc(cx,cy,r*1.5,0,7);ctx.fill();
  ctx.lineCap='round';ctx.shadowColor='#fff2aa';ctx.shadowBlur=22;ctx.strokeStyle='#fff8d0';ctx.lineWidth=Math.max(7,Math.min(w,h)*.025)*(1-dt*.8);ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(cx-r*.55,cy-r*.7,cx,cy);ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='#ffb34a';ctx.lineWidth=Math.max(4,Math.min(w,h)*.013);ctx.beginPath();ctx.arc(cx,cy,r*1.15,-2.4,1.5);ctx.stroke();
  for(let i=0;i<24;i++){const angle=i*2.399+attacks,dist=r*(.55+dt*2.1),x=cx+Math.cos(angle)*dist,y=cy+Math.sin(angle)*dist;ctx.fillStyle=i%3?'#ffca6e':'#b7eeff';ctx.beginPath();ctx.arc(x,y,Math.max(1,4.5*(1-dt/.55)),0,7);ctx.fill();}
  ctx.restore();}
  requestAnimationFrame(draw);
 }
 document.getElementById('strike').addEventListener('click',attack);
 window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,80));
 if(params.has('capture'))document.body.classList.add('capture');
 if(params.has('capture')&&Number(params.get('t')||0)>=3){hp=64;attacks=2;document.getElementById('boss-fill').style.width=hp+'%';}
 resize();requestAnimationFrame(draw);window.__pilot={attack,get hp(){return hp},get attacks(){return attacks},get imageReady(){return art.complete&&document.getElementById('hero-art').complete&&document.getElementById('foes-art').complete}};
})();
</script>
</body>
</html>
