<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Tidal Atlas — Card Score</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081622}
    canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:pointer}
    #status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Tidal Atlas 카드 점수 화면. 카드를 최대 세 장 골라 Chart selection 버튼으로 제출하세요."></canvas>
  <div id="status" aria-live="polite"></div>
  <script src="main.js"></script>
</body>
</html>
