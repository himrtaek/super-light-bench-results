<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#180d35">
  <link rel="preload" as="image" href="./assets/hero-idle.webp">
  <link rel="preload" as="image" href="./assets/robot-idle.webp">
  <link rel="preload" as="image" href="./assets/arena.webp">
  <title>Neon Riff — beat strike pilot</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130b2e;color:#fff;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',system-ui,sans-serif;touch-action:none;user-select:none}
    body{background-image:linear-gradient(180deg,rgba(13,7,30,.08),rgba(16,8,37,.07)),url('./assets/arena.webp');background-size:cover;background-position:center center}
    #stage,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}#fx{pointer-events:none}
    .grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(3,0,18,.07) 4px);mix-blend-mode:multiply}
    #hud{position:absolute;inset:0;pointer-events:none;text-shadow:3px 3px 0 #130923,-2px -2px 0 #130923,2px -2px 0 #130923,-2px 2px 0 #130923;letter-spacing:.06em}
    #brand{position:absolute;left:3.2%;top:4%;font-size:clamp(22px,3.8vw,48px);line-height:.86;font-style:italic;transform:skew(-10deg);color:#fff}#brand b{color:#f9df35}#brand small{display:block;margin-top:8px;color:#89f7ef;font:700 clamp(9px,1.1vw,13px) system-ui,sans-serif;letter-spacing:.26em;transform:skew(10deg)}
    #energy{position:absolute;left:3.2%;top:18%;width:min(28vw,285px);height:19px;transform:skew(-16deg);border:3px solid #0c0b1d;background:#49354d;box-shadow:4px 5px 0 #0b061c}#energy>span{display:block;width:85%;height:100%;background:linear-gradient(90deg,#f0468c,#ffe74b);border-right:4px solid #fff}
    #scorebox{position:absolute;right:3.8%;top:4%;text-align:right;font-style:italic}#scorebox label{display:block;font:800 clamp(10px,1.3vw,15px) system-ui,sans-serif;letter-spacing:.25em;color:#6effea}#score{font-size:clamp(27px,4vw,52px);line-height:1}#rank{display:inline-block;min-width:1.2em;margin-left:12px;text-align:center;color:#fff;background:#fa427a;transform:rotate(9deg);border:3px solid #111324;box-shadow:4px 4px 0 #ffca41}
    #combo{position:absolute;right:4%;top:22%;color:#ffe53c;font-size:clamp(22px,3.5vw,42px);font-style:italic;transform:rotate(-5deg)}#combo small{font:900 .37em system-ui,sans-serif;color:white}
    #target{position:absolute;left:55%;top:18%;width:22%;height:13px;transform:skew(-15deg);border:3px solid #101126;background:#332a51;box-shadow:4px 4px 0 #110b28}#target>span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4b87,#ff9e52)}#target::before{content:'IRON CHOIR · UNIT 07';position:absolute;bottom:14px;left:0;white-space:nowrap;color:#fff;font:900 clamp(9px,1.15vw,14px) system-ui,sans-serif;letter-spacing:.1em}
    #prompt{position:absolute;left:50%;bottom:11%;transform:translateX(-50%) skew(-8deg);white-space:nowrap;font:900 clamp(13px,1.8vw,21px) system-ui,sans-serif;letter-spacing:.08em;text-align:center}#prompt strong{display:inline-block;padding:4px 12px;background:#ffdf3d;color:#201334;text-shadow:none;border:3px solid #181129;box-shadow:4px 4px 0 #ed3981}
    #beatbar{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);height:29px;width:min(36vw,370px);border:3px solid #160f2b;border-radius:22px;background:#392550;box-shadow:3px 4px 0 #110922;overflow:visible}#beatbar:before,#beatbar:after{content:'';position:absolute;top:10px;width:calc(50% - 18px);height:3px;background:repeating-linear-gradient(90deg,#fcf5ff 0 4px,transparent 4px 27px)}#beatbar:before{left:6px}#beatbar:after{right:6px}#pulse{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:4px solid #120c27;border-radius:50%;background:#fb447d;box-shadow:0 0 0 4px #fff,0 0 24px #ff6d9b}
    #flash{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) rotate(-8deg);font-size:clamp(23px,3.3vw,38px);font-style:italic;color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
    #hint{position:absolute;left:3%;bottom:3%;font:700 clamp(9px,1vw,12px) system-ui,sans-serif;letter-spacing:.12em;color:#b5a4d4}
    @media (max-width:600px){#brand{top:3%}#energy{top:16%;width:38vw}#target{left:54%;top:17%;width:37%}#combo{top:23%}#prompt{bottom:20%}#beatbar{width:58vw;bottom:9%}#hint{display:none}}
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Neon Riff 3D action scene"></canvas><canvas id="fx"></canvas><div class="grain"></div>
  <div id="hud"><div id="brand">NEON <b>RIFF</b><small>ONE BEAT. ONE BLADE.</small></div><div id="energy"><span></span></div><div id="scorebox"><label>SCORE / STYLE</label><span id="score">000000</span><span id="rank">C</span></div><div id="combo">0 <small>COMBO</small></div><div id="target"><span></span></div><div id="prompt"><strong>SPACE / TAP</strong> ON THE BEAT</div><div id="beatbar"><span id="pulse"></span></div><div id="flash"></div><div id="hint">MOVE TO THE MUSIC · TAP ANYWHERE TO STRIKE</div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
