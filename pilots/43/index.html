const $=s=>document.getElementById(s);let S,T=0,manual=false,last=performance.now(),ready=false;const budget=188;function initial(){return{activeSquad:3,selectedSlot:0,squads:[['orin','cass','mote','vesper','keir','nix','sable','roan',null,null,null,null],['orin','cass','mote','vesper',null,'nix',null,'roan','elva',null,null,null],Array(12).fill(null),[...units.map(u=>u.id),null,null]],boosts:{},confirmed:[null,null,null,null],modal:false,message:'Select a card to inspect. Empty slots open the personnel register.',lastAction:'reset',rejections:0,events:[]}}
