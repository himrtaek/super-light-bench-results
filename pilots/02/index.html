<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b36"><title>태엽 정원 — 전장 파일럿</title>
<link rel="preload" as="image" href="assets/clockwork-canopy.webp" fetchpriority="high" media="(orientation: portrait)">
<link rel="preload" as="image" href="assets/clockwork-canopy-wide.webp" media="(orientation: landscape)">
<link rel="preload" as="image" href="assets/stag.webp">
<link rel="preload" as="image" href="assets/raven.webp">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 36%,#467470,#133e47 55%,#0b2532);color:#f9f0d7}
#game{position:fixed;inset:0;overflow:hidden}#game:before{content:'';position:absolute;inset:-40px;background:url('assets/clockwork-canopy.webp') center/cover;filter:blur(32px) brightness(.38) saturate(.85);opacity:.62}#field{position:absolute;top:clamp(38px,5vh,60px);left:50%;height:min(150vw,calc(100vh - 218px));aspect-ratio:2/3;transform:translateX(-50%);overflow:hidden;border:3px solid #d7b879;box-shadow:0 0 0 4px #153b42,0 16px 36px #061b28b8;background:#617e65;touch-action:manipulation}
#scene,#units,#ground-tint{position:absolute;inset:0;width:100%;height:100%}#scene{object-fit:cover;filter:saturate(.68) brightness(.77) contrast(.88)}#ground-tint{background:radial-gradient(ellipse 55% 34% at 50% 51%,#123943ad 0%,#12394359 65%,transparent 100%);pointer-events:none}#units{pointer-events:none}
#top{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;text-shadow:0 2px 4px #061a27}
#title{font:900 clamp(14px,3.8vw,23px) Georgia,serif;letter-spacing:.03em;line-height:1.05;color:#ffe0a1}#title small{display:block;font:700 8px system-ui;letter-spacing:.24em;color:#d9f2df}#score{padding:6px 9px;border:1px solid #dfba6d9c;background:#112f38c9;text-align:right;font:800 11px system-ui;white-space:nowrap}#score strong{color:#ffdc8b;font-size:17px}
#status{position:fixed;z-index:3;top:calc(max(8px,env(safe-area-inset-top)) + 42px);left:50%;transform:translateX(-50%);min-width:158px;padding:5px 10px;border-radius:20px;background:#123640dc;border:1px solid #9bdad2a3;color:#ebffea;text-align:center;font:700 10px system-ui;letter-spacing:.04em;white-space:nowrap}
#hud{position:fixed;z-index:4;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,440px);padding:10px 10px max(14px,env(safe-area-inset-bottom));background:linear-gradient(#194e58f5,#0c2635f8);border:2px solid #d5b273;border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -9px 25px #05232c91}
#hud-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font:800 10px system-ui;letter-spacing:.1em;color:#d8f3e8}#energy{color:#ffe1a3;font-size:14px}#energy-track{height:8px;margin-bottom:8px;border-radius:8px;background:#071c2e;border:1px solid #d5b27370;overflow:hidden}#energy-fill{height:100%;width:60%;background:linear-gradient(90deg,#00b7bb,#adf0ca);transition:width .15s}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{min-width:0;height:95px;padding:3px;background:linear-gradient(155deg,#e7d2a0,#b5824c);color:#182d36;border:2px solid #ffebb8;border-radius:10px;box-shadow:inset 0 0 0 1px #603e2a,0 3px 8px #0008;text-align:left;cursor:pointer;touch-action:manipulation}.card:active{transform:translateY(2px)}.card:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}
.portrait{position:relative;display:block;height:61px;border-radius:6px;overflow:hidden;background:radial-gradient(circle,#b4eee0,#3c7d82);border:1px solid #6d8f84}.portrait img{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);object-fit:contain}
.label{display:flex;justify-content:space-between;align-items:center;padding:2px 3px;font:900 11px system-ui;white-space:nowrap}.cost{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#103e49;color:#aef5eb;border:1px solid #c4f6d6}
#guide{margin-top:6px;text-align:center;font:600 10px system-ui;color:#b9d9d5}
#brief{display:none}
@media(min-aspect-ratio:1/1){#brief{display:block;position:fixed;z-index:3;left:14px;top:108px;width:clamp(190px,calc((100vw - 67vh)/2 - 24px),280px);padding:13px;border:2px solid #bfa170;border-radius:15px;background:linear-gradient(145deg,#19474dcf,#0b2835ed),url('assets/clockwork-canopy.webp') center/cover;box-shadow:0 8px 20px #061a22aa;color:#f7e6bf}#brief h2{margin:0 0 11px;font:900 18px Georgia,serif}#brief .line{display:flex;justify-content:space-between;align-items:center;margin:11px 0 4px;font:800 11px system-ui}#brief .line strong{font-size:16px}#brief .track{height:9px;border:1px solid #dbc18b99;background:#0b2029;border-radius:6px;overflow:hidden}#brief .fill{height:100%;width:100%;background:linear-gradient(90deg,#cd713c,#ffcf7d)}#brief #south-fill{background:linear-gradient(90deg,#208c91,#92ead5)}#brief .units-line{margin-top:15px;padding-top:10px;border-top:1px solid #bfa17082;font:800 11px system-ui;color:#bbf0e5}}
@media(min-aspect-ratio:1/1){#field{top:50%;height:min(calc(100vh - 14px),760px);transform:translate(-50%,-50%)}#top{left:14px;right:auto;display:block;max-width:calc((100vw - 67vh)/2 - 24px)}#score{margin-top:12px;text-align:left}#status{top:auto;bottom:16px;left:16px;transform:none;min-width:0}#hud{left:auto;right:12px;bottom:12px;transform:none;width:clamp(190px,calc((100vw - 67vh)/2 - 24px),280px);padding:10px;border-radius:15px;border:2px solid #d5b273}#cards{grid-template-columns:1fr;gap:5px}.card{display:flex;height:58px;align-items:center}.portrait{flex:0 0 52px;height:49px}.label{flex:1;padding:0 6px;font-size:10px}#guide{font-size:9px}}
@media(max-height:620px) and (max-aspect-ratio:1/1){#hud{padding-top:7px}#cards .card{height:75px}.portrait{height:44px}#field{height:min(150vw,calc(100vh - 197px))}}
@media(min-aspect-ratio:1/1){#game{--side:clamp(150px,20vw,240px)}#field{width:calc(100vw - var(--side) - var(--side) - 24px);max-width:900px;aspect-ratio:auto}#top{max-width:calc(var(--side) - 24px)}#hud,#brief{width:var(--side)}#brief{left:12px}#hud{right:12px}}
@media(min-aspect-ratio:1/1){#field{width:calc(100vw - 12px);max-width:none;height:calc(100vh - 12px)}#scene{filter:saturate(.82) brightness(.88) contrast(.92)}#ground-tint{background:radial-gradient(ellipse 45% 43% at 50% 52%,#0f353b70 0%,transparent 80%)}#brief{display:none}#top{left:20px;right:20px;display:flex;max-width:none}#score{margin-top:0}#status{top:55px;left:20px;bottom:auto}#hud{left:50%;right:auto;bottom:8px;transform:translateX(-50%);width:min(590px,calc(100vw - 24px));padding:7px 9px;border-radius:13px;background:linear-gradient(#194e58e8,#0c2635f2)}#hud-head{margin-bottom:4px}#energy-track{margin-bottom:5px}#cards{grid-template-columns:repeat(3,1fr);gap:7px}.card{height:60px}.portrait{flex:0 0 49px;height:48px}.label{font-size:10px}#guide{display:none}}
@media(min-aspect-ratio:1/1){#game:before{background-image:url('assets/clockwork-canopy-wide.webp')}#hud{padding:5px 8px;background:linear-gradient(#194e58d7,#0c2635e7)}#hud-head{margin-bottom:3px}#energy-track{height:6px;margin-bottom:4px}.card{height:52px}.portrait{flex-basis:42px;height:40px}}
</style>
</head>
<body>
<div id="game">
 <div id="field" aria-label="태엽 정원 전장, 누르면 선택한 유닛을 배치"><picture><source media="(min-aspect-ratio:1/1)" srcset="assets/clockwork-canopy-wide.webp"><img id="scene" src="assets/clockwork-canopy.webp" alt="정원 위 태엽 전장과 중앙의 운하" fetchpriority="high"></picture><div id="ground-tint"></div><canvas id="units" aria-hidden="true"></canvas></div>
 <header id="top"><div id="title"><small>THE CLOCKWORK CANOPY</small>태엽 정원</div><div id="score">북 <strong id="north-hp">240</strong> · 남 <strong id="south-hp">240</strong></div></header>
 <div id="status" role="status">정원 수호대를 배치하세요</div>
 <aside id="brief"><h2>정원의 전황</h2><div class="line">북쪽 황동 길드 <strong id="north-detail">240</strong></div><div class="track"><div class="fill" id="north-fill"></div></div><div class="line">남쪽 수호대 <strong id="south-detail">240</strong></div><div class="track"><div class="fill" id="south-fill"></div></div><div class="units-line">전장 유닛 <strong id="unit-count">6</strong></div></aside>
 <div id="hud"><div id="hud-head"><span>정원 수호대</span><span id="energy">에너지 6 / 10</span></div><div id="energy-track"><div id="energy-fill"></div></div>
  <div id="cards"><button class="card" data-type="0" aria-label="사슴 파수병 배치, 에너지 3"><span class="portrait"><img src="assets/stag.webp" alt=""></span><span class="label">사슴 파수병 <span class="cost">3</span></span></button><button class="card" data-type="1" aria-label="딱정벌레 기수 배치, 에너지 2"><span class="portrait"><img src="assets/beetle.webp" alt=""></span><span class="label">딱정벌레 기수 <span class="cost">2</span></span></button><button class="card" data-type="2" aria-label="태엽 나방 치유사 배치, 에너지 3"><span class="portrait"><img src="assets/moth.webp" alt=""></span><span class="label">태엽 나방 <span class="cost">3</span></span></button></div>
  <div id="guide">카드를 누르면 즉시 배치 · 전장을 눌러 위치 선택</div>
 </div>
</div>
<script src="main.js"></script>
</body>
</html>
