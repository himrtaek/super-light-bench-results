<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>햇살목장</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7cc22e;font-family:-apple-system,"SF Pro Rounded","Apple SD Gothic Neo","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;--u:min(1vw,1.78vh)}
.num{color:#fff;font-weight:900;letter-spacing:.02em;text-shadow:0 0 0 #000,-2px -2px 0 #4a2a08,2px -2px 0 #4a2a08,-2px 2px 0 #4a2a08,2px 2px 0 #4a2a08,0 3px 0 #4a2a08,0 4px 3px rgba(0,0,0,.35)}
/* level star */
#lvl{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*0.9);width:calc(var(--u)*6.6);height:calc(var(--u)*6.6)}
#lvl svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#lvl b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.3);padding-top:calc(var(--u)*0.4)}
#xp{position:absolute;left:calc(var(--u)*7.0);top:calc(var(--u)*3.0);width:calc(var(--u)*13);height:calc(var(--u)*2.0);border-radius:99px;background:linear-gradient(#3d2a12,#5b4020);box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 2px #2a1a08;overflow:hidden}
#xp i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:99px;background:linear-gradient(#b8f05a,#5cb81e 60%,#3f9a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
/* currencies */
.cur{position:absolute;right:calc(var(--u)*9.8);display:flex;align-items:center;gap:calc(var(--u)*0.6);font-size:calc(var(--u)*2.45)}
.cur svg{width:calc(var(--u)*3.0);height:calc(var(--u)*3.0);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
#coins{top:calc(var(--u)*1.6)}#gems{top:calc(var(--u)*5.0)}
/* round buttons */
.btn{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff9ea 0,#fbe8c4 55%,#f2cf92 100%);box-shadow:0 0 0 calc(var(--u)*0.55) #ffc23a,0 0 0 calc(var(--u)*0.85) #d77810,0 calc(var(--u)*0.55) 0 calc(var(--u)*0.85) #8a4a08,0 calc(var(--u)*0.9) calc(var(--u)*0.8) calc(var(--u)*0.6) rgba(0,0,0,.35)}
.btn::after{content:"";position:absolute;left:18%;top:8%;width:64%;height:30%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0))}
.btn svg{position:absolute;inset:14%;width:72%;height:72%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.s{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6)}
.l{width:calc(var(--u)*8.6);height:calc(var(--u)*8.6)}
#b1{left:calc(var(--u)*2.2);top:calc(var(--u)*13)}#b2{left:calc(var(--u)*2.2);top:calc(var(--u)*21.5)}#b3{left:calc(var(--u)*2.2);top:calc(var(--u)*30)}
#shop{left:calc(var(--u)*2.0);bottom:calc(var(--u)*2.2)}#friends{right:calc(var(--u)*2.0);bottom:calc(var(--u)*2.2)}
#gift{right:calc(var(--u)*1.6);top:calc(var(--u)*1.4)}
.badge{position:absolute;right:-6%;top:-6%;min-width:34%;height:34%;border-radius:99px;background:linear-gradient(#ff6a4a,#d8261a);box-shadow:0 0 0 2px #fff,0 2px 2px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--u)*1.5);z-index:2}
@media (max-aspect-ratio:1/1){
  #hud{--u:min(2.05vw,1.1vh)}
  #b1{top:calc(var(--u)*16)}#b2{top:calc(var(--u)*24)}#b3{top:calc(var(--u)*32)}
  .cur{right:calc(var(--u)*9.6)}
  #xp{width:calc(var(--u)*11)}
}
</style>
</head>

  <div class="btn s" id="b1"><svg viewBox="0 0 40 40"><rect x="8" y="6" width="24" height="30" rx="3" fill="#c8874a" stroke="#6a3a10" stroke-width="2"/><rect x="11" y="10" width="18" height="23" rx="1.5" fill="#fffaf0"/><rect x="15" y="3" width="10" height="6" rx="2" fill="#8a949e" stroke="#4a545e" stroke-width="1.5"/><path d="M14 16h12M14 21h12M14 26h8" stroke="#6a8a3a" stroke-width="2.4" stroke-linecap="round"/></svg><div class="badge" id="ordb">3</div></div>
  <div class="btn s" id="b2"><svg viewBox="0 0 40 40"><rect x="5" y="10" width="30" height="21" rx="3" fill="#fffaf0" stroke="#8a6a3a" stroke-width="2"/><path d="M6 12 20 23 34 12" fill="none" stroke="#8a6a3a" stroke-width="2"/><circle cx="31" cy="11" r="5" fill="#e8463a"/></svg></div>
  <div class="btn s" id="b3"><svg viewBox="0 0 40 40"><path d="M6 9h28a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H17l-8 6 1-6H6a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3z" fill="#fffaf0" stroke="#3f7ac0" stroke-width="2.4"/><circle cx="13" cy="19" r="2.2" fill="#3f7ac0"/><circle cx="20" cy="19" r="2.2" fill="#3f7ac0"/><circle cx="27" cy="19" r="2.2" fill="#3f7ac0"/></svg></div>
